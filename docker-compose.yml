services:
  db:
    image: postgres:17-alpine
    container_name: cinema-db
    environment:
      POSTGRES_DB: cinema
      POSTGRES_USER: cinema
      POSTGRES_PASSWORD: cinema
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cinema -d cinema"]
      interval: 10s
      timeout: 5s
      retries: 5

  svc-catalog:
    build:
      context: ./svc-catalog
      dockerfile: Dockerfile
    container_name: svc-catalog
    environment:
      CATALOG_HTTP_ADDR: :8081
    ports:
      - "8081:8081"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: cinema-frontend
    ports:
      - "3000:80"
    depends_on:
      - svc-catalog
    restart: unless-stopped

volumes:
  postgres_data:
