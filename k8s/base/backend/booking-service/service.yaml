apiVersion: v1
kind: Service
metadata:
  name: booking-service
  namespace: backend-ns
spec:
  type: ClusterIP
  ports:
  - port: 8084
    targetPort: 8084
    protocol: TCP
    name: http
  selector:
    app: booking-service
---
apiVersion: v1
kind: Service
metadata:
  name: booking-service-canary
  namespace: backend-ns
spec:
  type: ClusterIP
  ports:
  - port: 8084
    targetPort: 8084
    protocol: TCP
    name: http
  selector:
    app: booking-service
