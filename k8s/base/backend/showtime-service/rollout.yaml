apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: showtime-service
  namespace: backend-ns
  labels:
    app: showtime-service
spec:
  replicas: 2
  strategy:
    canary:
      stableService: showtime-service
      canaryService: showtime-service-canary
      trafficRouting:
        nginx:
          stableIngress: showtime-ingress
      steps:
      - setWeight: 10
      - pause: { duration: 5m }
      - setWeight: 50
      - pause: {}
      - setWeight: 100
  selector:
    matchLabels:
      app: showtime-service
  template:
    metadata:
      labels:
        app: showtime-service
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchExpressions:
                - key: app
                  operator: In
                  values:
                  - showtime-service
              topologyKey: kubernetes.io/hostname
        podAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 50
            podAffinityTerm:
              labelSelector:
                matchExpressions:
                - key: app
                  operator: In
                  values:
                  - db-showtime
              topologyKey: kubernetes.io/hostname
      initContainers:
      - name: db-migration
        image: migrate/migrate:v4.17.0
        command:
        - migrate
        - -path=/migrations
        - -database=$(DATABASE_URL)
        - up
        env:
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: db-showtime-secret
              key: DATABASE_URL
        volumeMounts:
        - name: migration-dir
          mountPath: /migrations
        resources:
          requests:
            cpu: 50m
            memory: 32Mi
          limits:
            cpu: 100m
            memory: 64Mi
      containers:
      - name: showtime-service
        image: adamad7/showtime-service:kustomize-placeholder
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8083
          name: http
        securityContext:
          readOnlyRootFilesystem: true
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
        env:
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: db-showtime-secret
              key: DATABASE_URL
        livenessProbe:
          httpGet:
            path: /health
            port: 8083
          initialDelaySeconds: 10
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 8083
          initialDelaySeconds: 5
          periodSeconds: 5
        resources:
          requests:
            cpu: 100m
            memory: 64Mi
          limits:
            cpu: 500m
            memory: 256Mi
        volumeMounts:
        - name: tmp-volume
          mountPath: /tmp
      volumes:
      - name: migration-dir
        configMap:
          name: showtime-db-migrations
      - name: tmp-volume
        emptyDir: {}
