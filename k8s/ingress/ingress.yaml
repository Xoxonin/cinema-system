apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: cinema-ingress
  namespace: frontend-ns
spec:
  ingressClassName: nginx
  rules:
  - http:
      paths:
      - path: /api/users
        pathType: Prefix
        backend:
          service:
            name: user-service
            port:
              number: 8081
      - path: /api/movies
        pathType: Prefix
        backend:
          service:
            name: catalog-service
            port:
              number: 8082
      - path: /api/showtimes
        pathType: Prefix
        backend:
          service:
            name: showtime-service
            port:
              number: 8083
      - path: /api/rooms
        pathType: Prefix
        backend:
          service:
            name: showtime-service
            port:
              number: 8083
      - path: /api/bookings
        pathType: Prefix
        backend:
          service:
            name: booking-service
            port:
              number: 8084
      - path: /
        pathType: Prefix
        backend:
          service:
            name: frontend
            port:
              number: 80
